[metadata]
allow-direct-references = true

[version]
path = "src/icalendar_builder/__version__.py"

[build.targets.wheel]
packages = ["src/icalendar_builder"]

# Env: default
[envs.default]
installer = "uv"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
]

# Env: test
[[envs.test.matrix]]
python = ["3.12", "3.11", "3.10"]

[envs.test]
installer = "uv"
dependencies = [
    "pytest==8.3.5",
    "pytest-cov>=4.1.0",
    "pytest-mock==3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-clarity>=1.0.1",
    "pytest-timeout>=2.1.0",
    "icalendar>=5.0.0",
]

[envs.test.scripts]
test = "pytest"
test-cov = [
    "pytest --cov --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]
test-quick = "pytest -x"

# Env: ruff
[envs.ruff]
installer = "uv"
dependencies = ["ruff==0.3.7"]

[envs.ruff.scripts]
check = "ruff check ./src ./tests"
fix = "ruff check ./src ./tests --fix"
format = "ruff format ./src ./tests"
format-check = "ruff format --check ./src ./tests"

# Env: mypy
[envs.mypy]
installer = "uv"
dependencies = [
    "mypy==1.10.1",
    "types-python-dateutil",
]

[envs.mypy.scripts]
check = "mypy src/icalendar_builder tests"
