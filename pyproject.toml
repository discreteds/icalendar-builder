[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icalendar-builder"
dynamic = ["version"]
description = "Modern Python library for generating ICS calendar files with type safety and validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["icalendar", "ics", "calendar", "events", "rfc5545"]
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
]
validation = [
    "icalendar>=5.0.0",  # For ICS validation
]

[project.urls]
Documentation = "https://github.com/nathanielramm/icalendar-builder#readme"
Issues = "https://github.com/nathanielramm/icalendar-builder/issues"
Source = "https://github.com/nathanielramm/icalendar-builder"

[project.scripts]
icalendar-builder = "icalendar_builder.cli:main"

# Tool: Coverage
[tool.coverage.run]
source_pkgs = ["icalendar_builder", "tests"]
branch = true
parallel = true
omit = ["src/icalendar_builder/__version__.py"]

[tool.coverage.paths]
icalendar_builder = [
    "src/icalendar_builder",
    "*/icalendar-builder/src/icalendar_builder",
]
tests = ["tests", "*/icalendar-builder/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
precision = 2
show_missing = true
skip_covered = false

# Tool: Ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*.py" = ["S101"]  # Allow assert in tests

# Tool: Mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Tool: Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=icalendar_builder",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take longer to run",
]
